## Crimson Desert Multiplayer site (C:\cdmp\site, copied by deploy\deploy_site.ps1).
## Requires DNS: A record  cdmp.breakneckhosting.com -> 66.51.99.113 (proxied via Cloudflare,
## which terminates TLS like the other breakneckhosting.com subdomains).
server
{
    listen 80;
    server_name cdmp.breakneckhosting.com;

    root C:/wwwroot/cdmp;
    index index.html;
    include snippets/deny-dotfiles.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The launcher: always a download, never rendered.
    location /download/ {
        types { application/octet-stream exe; }
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
    }

    access_log C:/BtSoft/nginx/logs/cdmp.access.log;
    error_log  C:/BtSoft/nginx/logs/cdmp.error.log;
}
